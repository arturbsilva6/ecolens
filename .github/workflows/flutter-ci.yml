name: Flutter CI — EcoLens

on:
  pull_request:
    branches:
      - feat/auth-profile
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Formatação, análise e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Verificar SDK
        run: flutter --version

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes Flutter
        if: ${{ !cancelled() }}
        run: flutter test

      - name: Verificar formatação do Dart
        if: ${{ !cancelled() }}
        run: dart format --output=none --set-exit-if-changed lib test
