name: Flutter CI — EcoLens

on:
  pull_request:
    branches:
      - feat/auth-profile
      - feat/uiux-home-conceito2
      - main
      - feat/species-identification
      - feat/community-map
  workflow_dispatch:
    inputs:
      base_ref:
        description: Referência base para comparar os arquivos Dart na execução manual
        required: true
        default: origin/main
        type: string

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-checks:
    name: Flutter — analyze e test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Instalar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Verificar SDK
        run: flutter --version

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes Flutter
        if: ${{ !cancelled() }}
        run: flutter test

  android-build:
    name: Android — compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Instalar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Usar Java 17
        run: echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"

      # Pega erros de Gradle, Kotlin e Manifest que os testes do Flutter não
      # veem. Sem key.properties, o APK sai com a chave de debug (só para CI).
      - name: Compilar APK de release
        run: |
          flutter pub get
          flutter build apk --release

  dart-format:
    name: Dart — formatação dos arquivos do PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Instalar Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.13.5'

      - name: Verificar formatação dos arquivos Dart alterados
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse --verify --end-of-options "${BASE_REF}^{commit}")
          head_sha=$(git rev-parse --verify --end-of-options "${HEAD_REF}^{commit}")
          changed_files="${RUNNER_TEMP}/changed-dart-files"

          # Compara com o merge-base, exclui exclusões e usa os nomes atuais
          # dos arquivos adicionados, copiados, modificados ou renomeados.
          git diff --name-only --diff-filter=ACMR -z \
            "${base_sha}...${head_sha}" -- '*.dart' > "$changed_files"
          mapfile -d '' -t dart_files < "$changed_files"

          if (( ${#dart_files[@]} == 0 )); then
            echo "Nenhum arquivo Dart alterado; formatação dispensada."
            exit 0
          fi

          printf 'Verificando %s arquivos Dart alterados.\n' "${#dart_files[@]}"
          if ! dart format --set-exit-if-changed -- "${dart_files[@]}"; then
            # Mostra exatamente o que precisa mudar, para corrigir sem
            # precisar adivinhar a partir só dos nomes dos arquivos.
            echo "::group::Diferenças de formatação"
            git --no-pager diff
            echo "::endgroup::"
            echo "Rode 'dart format' nos arquivos acima e envie de novo."
            exit 1
          fi

